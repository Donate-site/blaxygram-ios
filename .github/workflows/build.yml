name: Build Blaxygram IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blaxygram-ios-esign-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Check Xcode and disk
        run: |
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h .
          sysctl -n hw.memsize

      - name: Checkout pinned iOS client
        uses: actions/checkout@v4
        with:
          repository: iamxvbaba/gramsrv-Telegram-iOS
          ref: 16f191d403e3b587578f8f32bae814cce1681853
          path: source
          persist-credentials: false

      - name: Initialize dependencies
        working-directory: source
        run: |
          git submodule init
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/iamxvbaba/tgcalls.git
          git submodule update --init --recursive --jobs 4 --depth 1

      - name: Configure Blaxygram
        run: python3 builder/prepare.py source

      - name: Build unsigned iPhone IPA
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          (
            while sleep 60; do
              date -u '+Build heartbeat: %Y-%m-%d %H:%M:%S UTC'
              df -h .
              vm_stat | head -n 8
              ps -axo pid,rss,comm -m | head -n 8
            done
          ) &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true' EXIT
          python3 -u build-system/Make/Make.py build \
            --configurationPath=build-system/blaxygram-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" 2>&1 | tee ../build.log

      - name: Verify and collect IPA
        id: verify
        run: |
          mkdir -p artifacts
          cp source/bazel-bin/Telegram/Telegram.ipa artifacts/Blaxygram.ipa
          python3 builder/verify_ipa.py artifacts/Blaxygram.ipa
          git -C source diff --binary > artifacts/Blaxygram-source-changes.patch
          cp builder/prepare.py builder/brand_market.py builder/blaxygram-public.pem builder/Blaxygram.png builder/Blaxygment.png artifacts/

      - name: Upload IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: Blaxygram-IPA-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve package for diagnostics if verification fails
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Blaxygram-UNVERIFIED-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blaxygram-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
